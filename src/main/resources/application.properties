# ===============================
# = Flyway - Migrations automatiques de base de données
# ===============================
# baseline-on-migrate=true : permet à Flyway de fonctionner sur les bases existantes
# sans historique Flyway (databases créées avant l'ajout de Flyway).
# Ce paramètre doit rester activé en permanence : il est sans effet sur les bases
# qui ont déjà une table flyway_schema_history, et protège les nouvelles bases
# déployées sans historique Flyway préexistant.
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
# baseline-version=0 : toutes les migrations (V999, V1000, etc.) seront appliquées
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# Après renommage / correction de scripts déjà appliqués : repair réaligne les checksums dans flyway_schema_history.
# Une fois la BDD alignée, garder false (prod). Dev peut surcharger dans application-dev.properties.
spring.flyway.repair-before-migrate=${SPRING_FLYWAY_REPAIR_BEFORE_MIGRATE:false}

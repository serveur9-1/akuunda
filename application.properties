server.tomcat.threads.max=100
# Hikari Data Source Configuration
#minimum number of idle connections maintained by HikariCP in a connection pool
spring.datasource.hikari.minimum-idle= 5
#maximum pool size
spring.datasource.hikari.maximum-pool-size= 20
#maximum number of milliseconds that a client will wait for a connection
spring.datasource.hikari.connection-timeout=30000
#maximum idle time for connection (5 minutes - connections will be closed if idle longer)
spring.datasource.hikari.idle-timeout=300000
# maximum lifetime in milliseconds of a connection in the pool (10 minutes - shorter to avoid dead connections)
# Must be less than database's connection timeout
spring.datasource.hikari.max-lifetime=600000
# keepalive time to prevent connections from being closed by the database (4 minutes - run before max-lifetime)
spring.datasource.hikari.keepalive-time=240000
# test query to validate connections before use
spring.datasource.hikari.connection-test-query=SELECT 1
# validate connections before returning them from the pool
spring.datasource.hikari.leak-detection-threshold=60000
# validation timeout for connection test query (5 seconds)
spring.datasource.hikari.validation-timeout=5000
#default auto-commit behavior.
spring.datasource.hikari.auto-commit=true


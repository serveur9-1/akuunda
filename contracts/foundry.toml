[profile.default]
src     = "src"
test    = "test"
script  = "script"
out     = "out"
libs    = ["lib"]
solc    = "0.8.24"
optimizer       = true
optimizer_runs  = 200
via_ir          = false

[rpc_endpoints]
polygon      = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"

[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }
